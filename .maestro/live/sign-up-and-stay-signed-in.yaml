# Phase 1 acceptance test against the real Supabase project:
# sign up, go through onboarding, restart the app and still be signed in, then sign out.
#
# Needs .env.local with the project's address and publishable key, "Confirm email" turned
# off in Supabase, the development build on a booted simulator and the dev server running.
#
#   npm run e2e:live
#
# Each run creates one new test account (banter.e2e.<time>@example.com). Delete them in
# the Supabase dashboard under Authentication > Users when you like.
appId: com.banterlines.app
---
- runFlow:
    file: ../common/new-test-account.yaml
    env:
      PREFIX: "auth"
- runFlow: ../common/open-app.yaml
- runFlow: ../common/ensure-signed-out.yaml
- assertNotVisible:
    id: "setup-problem"

# Sign up. A new account starts in onboarding; get through it the short way.
- runFlow: ../common/sign-up-new-account.yaml
- runFlow: ../common/finish-onboarding-quickly.yaml
- runFlow: ../common/go-to-settings.yaml
- assertVisible:
    id: "account-email"
    text: ${output.email}
- takeScreenshot: live-signed-in

# Restart the app without clearing anything: still signed in.
- stopApp
- runFlow: ../common/open-app.yaml
- extendedWaitUntil:
    visible:
      id: "generate-screen"
    timeout: 90000
- runFlow: ../common/go-to-settings.yaml
- assertVisible:
    id: "account-email"
    text: ${output.email}
- takeScreenshot: live-still-signed-in-after-restart

# Sign out: back to the sign-in screen, and the app is no longer reachable.
- runFlow: ../common/sign-out.yaml
- assertNotVisible:
    id: "generate-screen"

# Sign in again with the same account.
- tapOn:
    id: "email-input"
- inputText: ${output.email}
- tapOn:
    id: "password-input"
- inputText: ${output.password}
- tapOn: "Banter"
- tapOn:
    id: "submit-button"
- runFlow: ../common/dismiss-password-prompt.yaml
- extendedWaitUntil:
    visible:
      id: "generate-screen"
    timeout: 20000

# A wrong password is refused with a clear message.
- runFlow: ../common/go-to-settings.yaml
- runFlow: ../common/sign-out.yaml
- tapOn:
    id: "email-input"
- inputText: ${output.email}
- tapOn:
    id: "password-input"
- inputText: "definitely-wrong-password"
- tapOn: "Banter"
- tapOn:
    id: "submit-button"
- runFlow: ../common/dismiss-password-prompt.yaml
- assertVisible: "Wrong email or password."
- takeScreenshot: live-wrong-password
