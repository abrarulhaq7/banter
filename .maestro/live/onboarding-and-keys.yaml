# Phase 2 acceptance test against the real Supabase project and the real providers:
# onboarding rules, a wrong key is refused with a clear message, the profile is saved and
# survives a restart, and the keys screens work with no key.
#
# No real key is used. The made-up keys below are sent to Gemini and OpenAI, which reject
# them; that rejection is what this test checks. Adding a working key is checked by hand.
#
#   npm run e2e:live
appId: com.banterlines.app
---
- runFlow:
    file: ../common/new-test-account.yaml
    env:
      PREFIX: "keys"
- runFlow: ../common/open-app.yaml
- runFlow: ../common/ensure-signed-out.yaml
- runFlow: ../common/sign-up-new-account.yaml

# --- Step 1: about you --------------------------------------------------------------------
- takeScreenshot: onboarding-about

# A name is required. Continue is pinned to the bottom: nothing to scroll.
- tapOn:
    id: "profile-submit"
- assertVisible: "Enter your name."

- tapOn:
    id: "profile-name"
- inputText: "Sam"
- assertVisible:
    id: "profile-name"
    text: "Sam"
- assertNotVisible: "Enter your name."

# Under 18 is refused.
- tapOn:
    id: "profile-age"
- inputText: "16"
- assertVisible: "Banter is for adults. You must be 18 or older."
- takeScreenshot: onboarding-under-18

# A valid profile goes through.
- eraseText: 2
- inputText: "27"
- assertNotVisible: "Banter is for adults. You must be 18 or older."
- tapOn:
    id: "profile-city"
- inputText: "Lahore"
- runFlow: ../common/close-keyboard.yaml
- tapOn:
    id: "profile-submit"
- extendedWaitUntil:
    visible:
      id: "onboarding-voice-screen"
    timeout: 15000

# --- Step 2: how you sound (optional) -----------------------------------------------------
- takeScreenshot: onboarding-voice
- tapOn:
    id: "profile-interests"
- inputText: "Football, cooking"
- runFlow: ../common/close-keyboard.yaml
- tapOn:
    id: "profile-submit"
- extendedWaitUntil:
    visible:
      id: "onboarding-key-screen"
    timeout: 15000

# --- Step 3: first key --------------------------------------------------------------------
- takeScreenshot: onboarding-key

# A made-up Gemini key is sent to Gemini and rejected.
- tapOn:
    id: "key-input"
- inputText: "fake-gemini-key-for-banter-tests"
- runFlow: ../common/close-keyboard.yaml
- tapOn:
    id: "key-submit"
- extendedWaitUntil:
    visible: "Gemini rejected this key.*"
    timeout: 30000
- takeScreenshot: onboarding-wrong-key

# Carry on without a key.
- tapOn:
    id: "skip-key"
- extendedWaitUntil:
    visible:
      id: "generate-screen"
    timeout: 15000
# With no key, the Generate screen says so.
- assertVisible:
    id: "no-key-notice"
- takeScreenshot: generate-no-key
- runFlow: ../common/go-to-settings.yaml
- assertVisible:
    id: "greeting"
    text: "Hi Sam."
- assertVisible:
    id: "manage-keys"
    text: ".*No key yet.*"
- takeScreenshot: settings-no-key

# --- Restart: still past onboarding, profile still there --------------------------------
- stopApp
- runFlow: ../common/open-app.yaml
- extendedWaitUntil:
    visible:
      id: "generate-screen"
    timeout: 90000
- runFlow: ../common/go-to-settings.yaml
- assertVisible:
    id: "greeting"
    text: "Hi Sam."

# --- About you: one row per fact, each edited in its own sheet ----------------------------
- tapOn:
    id: "edit-profile"
- assertVisible:
    id: "profile-screen"
# A row reads "title, what is saved".
- assertVisible:
    id: "profile-row-name"
    text: ".*Sam.*"
- assertVisible:
    id: "profile-row-age"
    text: ".*27.*"
- assertVisible:
    id: "profile-row-city"
    text: ".*Lahore.*"
- assertVisible:
    id: "profile-row-interests"
    text: ".*Football, cooking.*"
- assertVisible:
    id: "profile-row-work"
    text: ".*Not set.*"
- takeScreenshot: profile

- tapOn:
    id: "profile-row-name"
- assertVisible:
    id: "profile-edit"
- tapOn:
    id: "profile-name"
- inputText: "my"
- takeScreenshot: profile-name-sheet
- tapOn:
    id: "profile-save"
- extendedWaitUntil:
    visible:
      id: "profile-row-name"
      text: ".*Sammy.*"
    timeout: 15000
- tapOn:
    id: "back-button"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 15000
- assertVisible:
    id: "greeting"
    text: "Hi Sammy."

# --- Add a key from Settings: a made-up OpenAI key is rejected by OpenAI ------------------
- tapOn:
    id: "manage-keys"
- assertVisible:
    id: "add-key-screen"
- tapOn:
    id: "key-input"
- inputText: "sk-fake-openai-key-for-banter-tests"
# The provider follows what the key looks like.
- assertVisible:
    id: "provider-openai"
    selected: true
- runFlow: ../common/close-keyboard.yaml
# The model is one row; its choices are in a sheet.
- tapOn:
    id: "key-model"
- assertVisible:
    id: "key-model-sheet"
- takeScreenshot: add-key-model-sheet
- tapOn:
    id: "sheet-close"
- tapOn:
    id: "key-submit"
- extendedWaitUntil:
    visible: "OpenAI rejected this key.*"
    timeout: 30000
- takeScreenshot: add-key-wrong-openai-key
- tapOn:
    id: "back-button"
- assertVisible:
    id: "settings-screen"

# Leave the app signed out for the next flow.
- runFlow: ../common/sign-out.yaml
