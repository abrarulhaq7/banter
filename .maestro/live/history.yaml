# Phase 5 acceptance test: what is saved after generating, and the People screens.
#
# Generates twice for one screenshot with real answers from Gemini, then reads the test
# account straight from Supabase to confirm the person, both interactions, their lines,
# the copied and kept marks and the one stored screenshot. Then opens People, the person,
# that screenshot's lines, and marks the copied line as "She replied".
#
# Needs supabase/migrations up to 20261125000400_history.sql applied to the project.
# Everything saved is deleted again at the end.
#
#   npm run e2e:live -- .maestro/live/history.yaml
appId: com.banterlines.app
env:
  PERSON: "banter.e2e.person"
# Runs however the flow ends, so a failed run never leaves the real key or saved history
# in its test account.
onFlowComplete:
  - runScript:
      file: ../scripts/remove-history.js
      env:
        EMAIL: ${output.email}
        PASSWORD: ${output.password}
  - runScript:
      file: ../scripts/remove-keys.js
      env:
        EMAIL: ${output.email}
        PASSWORD: ${output.password}
---
- runFlow:
    file: ../common/new-test-account.yaml
    env:
      PREFIX: "hist"
- runFlow: ../common/open-app.yaml
- runFlow: ../common/ensure-signed-out.yaml
- runFlow: ../common/sign-up-new-account.yaml
- runFlow: ../common/finish-onboarding-quickly.yaml
- runScript:
    file: ../scripts/seed-real-key.js
    env:
      EMAIL: ${output.email}
      PASSWORD: ${output.password}
- stopApp
- runFlow: ../common/open-app.yaml
- extendedWaitUntil:
    visible:
      id: "generate-screen"
    timeout: 90000
- extendedWaitUntil:
    notVisible:
      id: "no-key-notice"
    timeout: 30000

# --- Nobody yet --------------------------------------------------------------------------
- tapOn:
    id: "tab-people"
- extendedWaitUntil:
    visible:
      id: "no-people"
    timeout: 30000
- takeScreenshot: history-nobody-yet
- tapOn:
    id: "tab-generate"
- extendedWaitUntil:
    visible:
      id: "generate-screen"
    timeout: 15000

# --- First set: Casual -------------------------------------------------------------------
- tapOn:
    id: "use-latest"
- runFlow:
    when:
      visible: "Allow Full Access"
    commands:
      - tapOn: "Allow Full Access"
- extendedWaitUntil:
    visible:
      id: "screenshot-preview"
    timeout: 30000
- tapOn:
    id: "generate-button"
- runFlow:
    file: ../common/wait-for-result.yaml
    env:
      HEADING: "Casual · Story reply"

# The top of Results says who the lines are saved under, as the AI read it.
- assertVisible:
    id: "person-row"
- takeScreenshot: history-saved-under

# Correct the username, in a sheet. What was saved moves to that person.
- tapOn:
    id: "person-change"
- tapOn:
    id: "person-input"
- eraseText: 40
- inputText: ${PERSON}
- takeScreenshot: history-username-sheet
- runFlow:
    file: ../common/tap-after-typing.yaml
    env:
      ID: "person-save"
- assertVisible:
    id: "person-username"
    text: "@${PERSON}"

# Copy the first line, keep the second.
- tapOn:
    id: "line-0-0"
- assertVisible:
    id: "line-status-0-0"
    text: "Copied"
- tapOn:
    id: "keep-0-1"
- assertVisible:
    id: "kept-button"

# --- Second set: Flirty, same screenshot -------------------------------------------------
- tapOn:
    id: "another-tone"
- tapOn:
    id: "tone-flirty"
- runFlow:
    file: ../common/wait-for-result.yaml
    env:
      HEADING: "Flirty · Story reply"

# --- People ------------------------------------------------------------------------------
- tapOn:
    id: "back-button"
- extendedWaitUntil:
    visible:
      id: "generate-screen"
    timeout: 15000
- tapOn:
    id: "tab-people"
- extendedWaitUntil:
    visible:
      id: "person-card-0"
    timeout: 30000
# Nothing is left waiting on the phone.
- extendedWaitUntil:
    notVisible:
      id: "history-waiting"
    timeout: 30000
- takeScreenshot: history-people

# What Supabase holds now.
- runScript:
    file: ../scripts/check-history.js
    env:
      EMAIL: ${output.email}
      PASSWORD: ${output.password}
      USERNAME: ${PERSON}
      EXPECT_RESULT: "none"

# --- One person: a short row per screenshot ----------------------------------------------
- tapOn:
    id: "person-card-0"
- extendedWaitUntil:
    visible:
      id: "shot-row-0"
    timeout: 30000
# One screenshot was used, so there is one row, however many tones were tried.
- assertNotVisible:
    id: "shot-row-1"
- takeScreenshot: history-person

# --- That screenshot: its lines, one set at a time ---------------------------------------
- tapOn:
    id: "shot-row-0"
- extendedWaitUntil:
    visible:
      id: "shot-heading"
      text: "Flirty · Story reply"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "shot-screenshot"
    timeout: 30000
- takeScreenshot: history-shot-newest
- tapOn:
    id: "shot-set-chip-1"
- assertVisible:
    id: "shot-heading"
    text: "Casual · Story reply"

# Mark how the copied line went.
- scrollUntilVisible:
    element:
      id: "replied-0"
    direction: DOWN
- waitForAnimationToEnd
- assertVisible:
    id: "shot-line-state-0"
    text: "Copied"
- tapOn:
    id: "replied-0"
- assertVisible:
    id: "replied-0"
    selected: true
- takeScreenshot: history-marked-replied
- runScript:
    file: ../scripts/check-history.js
    env:
      EMAIL: ${output.email}
      PASSWORD: ${output.password}
      USERNAME: ${PERSON}
      EXPECT_RESULT: "replied"

# --- Leave the app signed out. The key and the saved history are removed by onFlowComplete. --
- runFlow: ../common/scroll-to-top.yaml
- tapOn:
    id: "back-button"
- extendedWaitUntil:
    visible:
      id: "person-screen"
    timeout: 15000
- tapOn:
    id: "back-button"
- extendedWaitUntil:
    visible:
      id: "people-screen"
    timeout: 15000
- runFlow: ../common/go-to-settings.yaml
- takeScreenshot: history-settings
- tapOn:
    id: "sign-out-button"
- assertVisible:
    id: "dialog-confirm"
- takeScreenshot: history-sign-out-dialog
- tapOn:
    id: "dialog-confirm"
- extendedWaitUntil:
    visible:
      id: "sign-in-screen"
    timeout: 15000
