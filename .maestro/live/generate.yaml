# The Generate tab and the Results screen end to end, with real answers from Gemini.
#
# Uses the newest photo in the simulator (put there by scripts/sim-photos.sh, which
# npm run e2e:live runs first) and the Gemini key from keys.local.json. The key is saved
# into this run's throwaway account and deleted from it again at the end.
#
# The flow checks that things appear and work. It does not check what the lines say:
# that changes on every run.
#
#   npm run e2e:live -- .maestro/live/generate.yaml
appId: com.banterlines.app
# Runs however the flow ends, so a failed run never leaves the real key or saved history
# in its test account.
onFlowComplete:
  - runScript:
      file: ../scripts/remove-history.js
      env:
        EMAIL: ${output.email}
        PASSWORD: ${output.password}
  - runScript:
      file: ../scripts/remove-keys.js
      env:
        EMAIL: ${output.email}
        PASSWORD: ${output.password}
---
- runFlow:
    file: ../common/new-test-account.yaml
    env:
      PREFIX: "gen"
- runFlow: ../common/open-app.yaml
- runFlow: ../common/ensure-signed-out.yaml
- runFlow: ../common/sign-up-new-account.yaml
- runFlow: ../common/finish-onboarding-quickly.yaml

# No key yet: the screen says so, and there is nothing to generate with.
- assertVisible:
    id: "no-key-notice"

- runScript:
    file: ../scripts/seed-real-key.js
    env:
      EMAIL: ${output.email}
      PASSWORD: ${output.password}

# Restart: the key is loaded and the notice is gone.
- stopApp
- runFlow: ../common/open-app.yaml
- extendedWaitUntil:
    visible:
      id: "generate-screen"
    timeout: 90000
- extendedWaitUntil:
    notVisible:
      id: "no-key-notice"
    timeout: 30000
- takeScreenshot: generate-empty

# --- Guide: the button at the top opens the best setups, each on its own page ------------
- tapOn:
    id: "open-guide"
- assertVisible:
    id: "guide-screen"
- takeScreenshot: guide
- tapOn:
    id: "guide-setup-heat"
- assertVisible:
    id: "guide-choose"
- assertVisible: "Turn up the heat"
- takeScreenshot: guide-setup-heat
- tapOn:
    id: "back-button"
- scrollUntilVisible:
    element:
      id: "guide-topic-how-you-know-her"
    direction: DOWN
- waitForAnimationToEnd
- tapOn:
    id: "guide-topic-how-you-know-her"
- assertVisible:
    id: "guide-topic-screen"
- takeScreenshot: guide-topic
- tapOn:
    id: "back-button"
# The guide list is still scrolled down, so its Back button is off the top of the screen.
- runFlow: ../common/scroll-to-top.yaml
- tapOn:
    id: "back-button"
- assertVisible:
    id: "generate-screen"

# --- Screenshot --------------------------------------------------------------------------
- tapOn:
    id: "use-latest"
# The first time, iOS asks for photo access (already granted by the setup script, but a
# fresh simulator may still ask).
- runFlow:
    when:
      visible: "Allow Full Access"
    commands:
      - tapOn: "Allow Full Access"

# --- Quick questions: they open by themselves once the screenshot is ready ----------------
# (On iOS the screen behind an open sheet is not in the tree, so the preview is checked after.)
- extendedWaitUntil:
    visible:
      id: "quick-questions-sheet"
    timeout: 30000
- takeScreenshot: generate-quick-questions
# Turn up the heat is offered only for someone he knows.
- assertNotVisible:
    id: "quick-goal-heat"
- tapOn:
    id: "quick-context-know_her"
- assertVisible:
    id: "quick-goal-heat"
- tapOn:
    id: "quick-context-know_her"
- assertNotVisible:
    id: "quick-goal-heat"
# Start talking, for a story: Casual, the tone the rest of this flow expects.
- tapOn:
    id: "quick-goal-start"
- assertVisible: "Use Casual"
- tapOn:
    id: "quick-apply"
- assertNotVisible:
    id: "quick-questions-sheet"
# Help me pick asks again at any time; closing it changes nothing.
- tapOn:
    id: "quick-questions-open"
- assertVisible:
    id: "quick-questions-sheet"
- tapOn:
    id: "sheet-close"
- assertNotVisible:
    id: "quick-questions-sheet"

# Layout rule: everything on this tab, and its main button, is in reach without scrolling.
- assertVisible:
    id: "screenshot-preview"
- assertVisible:
    id: "mode-story_reply"
- assertVisible:
    id: "tone-casual"
- assertVisible:
    id: "context-row"
- assertVisible:
    id: "generate-button"
- takeScreenshot: generate-screenshot-chosen

# "How you know her" is one row; the choices open in a sheet.
- tapOn:
    id: "context-row"
- assertVisible:
    id: "context-stranger"
- takeScreenshot: generate-context-sheet
- tapOn:
    id: "context-stranger"
- assertNotVisible:
    id: "context-stranger"

# --- Story reply, Casual: the lines open on their own screen ------------------------------
- tapOn:
    id: "generate-button"
- runFlow:
    file: ../common/wait-for-result.yaml
    env:
      HEADING: "Casual · Story reply"
- assertVisible:
    id: "results-screen"
# Layout rule: three lines and the action bar fit without scrolling.
- assertVisible:
    id: "line-0-0"
- assertVisible:
    id: "line-0-2"
- assertVisible:
    id: "adjust-shorter"
- takeScreenshot: generate-lines-casual

# Tap a line to copy it.
- tapOn:
    id: "line-0-0"
- assertVisible:
    id: "line-status-0-0"
    text: "Copied"
- assertVisible:
    id: "toast"

# Like the third line: more like this.
- tapOn:
    id: "like-0-2"
- assertVisible:
    id: "line-status-0-2"
    text: "Liked"
- takeScreenshot: generate-line-liked

# Report these lines: the set is attached. Not sent, so test runs leave no tickets.
- scrollUntilVisible:
    element:
      id: "report-set"
    direction: DOWN
- waitForAnimationToEnd
- tapOn:
    id: "report-set"
- assertVisible:
    id: "feedback-screen"
- assertVisible:
    id: "feedback-kind-lines"
    selected: true
- assertVisible:
    id: "feedback-screenshot"
    text: ".*On.*"
- takeScreenshot: feedback-report-lines
- tapOn:
    id: "feedback-included"
- assertVisible:
    id: "feedback-included-sheet"
- takeScreenshot: feedback-included
- tapOn:
    id: "sheet-close"
- tapOn:
    id: "back-button"
- assertVisible:
    id: "results-screen"
- runFlow: ../common/scroll-to-top.yaml

# Keep the second line.
- tapOn:
    id: "keep-0-1"
- assertVisible:
    id: "kept-button"

# --- Another tone: the earlier lines stay, behind a chip ---------------------------------
- tapOn:
    id: "another-tone"
- assertVisible:
    id: "tone-option-flirty"
- takeScreenshot: generate-tone-sheet
- tapOn:
    id: "tone-option-flirty"
- runFlow:
    file: ../common/wait-for-result.yaml
    env:
      HEADING: "Flirty · Story reply"
- takeScreenshot: generate-kept-and-flirty
# The Casual set is one tap away.
- tapOn:
    id: "set-chip-1"
- assertVisible:
    id: "result-heading-0"
    text: "Casual · Story reply"
- tapOn:
    id: "set-chip-0"
- assertVisible:
    id: "result-heading-0"
    text: "Flirty · Story reply"

# The kept line is in its sheet.
- tapOn:
    id: "kept-button"
- assertVisible:
    id: "line-kept-0"
- takeScreenshot: generate-kept-sheet
- tapOn:
    id: "sheet-close"

# --- Shorter -----------------------------------------------------------------------------
- tapOn:
    id: "adjust-shorter"
- runFlow:
    file: ../common/wait-for-result.yaml
    env:
      HEADING: "Flirty · Story reply · Shorter"
- takeScreenshot: generate-shorter

# --- Analyse, from the Generate tab ------------------------------------------------------
- tapOn:
    id: "back-button"
- extendedWaitUntil:
    visible:
      id: "generate-screen"
    timeout: 15000
# The lines made so far are one tap away.
- assertVisible:
    id: "view-lines"
- tapOn:
    id: "mode-analyse"
# Analyse has no tone.
- assertNotVisible:
    id: "tone-flirty"
- tapOn:
    id: "generate-button"
- runFlow:
    file: ../common/wait-for-result.yaml
    env:
      HEADING: "Analyse"
# The sample is a story, not a chat, so the AI may analyse it or decline. Either is a
# correct result here.
- assertVisible:
    id: "result-analysis-0|result-declined-0"
- takeScreenshot: generate-analyse

# --- Clear: back to no screenshot, ready for a new one ------------------------------------
- tapOn:
    id: "back-button"
- extendedWaitUntil:
    visible:
      id: "generate-screen"
    timeout: 15000
- assertVisible:
    id: "clear-screenshot"
- tapOn:
    id: "clear-screenshot"
- assertVisible:
    id: "screenshot-empty"
- assertNotVisible:
    id: "view-lines"
- assertNotVisible:
    id: "clear-screenshot"
- takeScreenshot: generate-cleared

# --- Leave the app signed out. The key and the saved history are removed by onFlowComplete. --
- runFlow: ../common/go-to-settings.yaml
- takeScreenshot: settings
- runFlow: ../common/sign-out.yaml
