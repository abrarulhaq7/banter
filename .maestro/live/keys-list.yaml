# Keys screens against the real Supabase project: order, check again, turn off, delete,
# and that all of it is still there after restarting the app.
#
# Two made-up keys are planted in the test account's rows first (the app itself refuses
# to save a key the provider rejects). "Check again" sends one of them to OpenAI, which
# rejects it; that rejection is part of what is checked.
#
#   npm run e2e:live
appId: com.banterlines.app
---
- runFlow:
    file: ../common/new-test-account.yaml
    env:
      PREFIX: "list"
- runFlow: ../common/open-app.yaml
- runFlow: ../common/ensure-signed-out.yaml
- runFlow: ../common/sign-up-new-account.yaml
- runFlow: ../common/finish-onboarding-quickly.yaml

- runScript:
    file: ../scripts/seed-keys.js
    env:
      EMAIL: ${output.email}
      PASSWORD: ${output.password}

# Restart: the app loads the two keys from Supabase.
- stopApp
- runFlow: ../common/open-app.yaml
- extendedWaitUntil:
    visible:
      id: "generate-screen"
    timeout: 90000
- runFlow: ../common/go-to-settings.yaml
- extendedWaitUntil:
    visible:
      id: "manage-keys"
      text: ".*2 keys saved, 2 active..*"
    timeout: 30000

- tapOn:
    id: "manage-keys"
- assertVisible:
    id: "keys-screen"
# A row reads "name, state · model".
- assertVisible:
    id: "key-card-0"
    text: ".*Seed A.*Active.*"
- assertVisible:
    id: "key-card-1"
    text: ".*Seed B.*"
- takeScreenshot: keys-list

# Order: move the first key down.
- tapOn:
    id: "key-down-0"
- assertVisible:
    id: "key-card-0"
    text: ".*Seed B.*"
- assertVisible:
    id: "key-card-1"
    text: ".*Seed A.*"

# A row opens its key. Check again: OpenAI rejects the made-up key, and it is marked rejected.
- tapOn:
    id: "key-card-0"
- assertVisible:
    id: "edit-key-screen"
- assertVisible:
    id: "edit-key-title"
    text: "Seed B"
- takeScreenshot: key-edit
- tapOn:
    id: "edit-key-check"
- extendedWaitUntil:
    visible:
      id: "edit-key-error"
    timeout: 30000
- assertVisible:
    id: "edit-key-error"
    text: "OpenAI rejected this key.*"
- takeScreenshot: key-rejected
- tapOn:
    id: "back-button"
- assertVisible:
    id: "key-card-0"
    text: ".*Seed B.*Rejected.*"

# Turn the other key off.
- tapOn:
    id: "key-card-1"
- assertVisible:
    id: "edit-key-title"
    text: "Seed A"
- tapOn:
    id: "edit-key-toggle"
- extendedWaitUntil:
    visible:
      id: "edit-key-toggle"
      text: ".*Turn this key on.*"
    timeout: 15000
- tapOn:
    id: "back-button"
- assertVisible:
    id: "key-card-1"
    text: ".*Seed A.*Off.*"
- takeScreenshot: keys-list-after-changes

# Restart: order and states were saved, not just shown.
- stopApp
- runFlow: ../common/open-app.yaml
- extendedWaitUntil:
    visible:
      id: "generate-screen"
    timeout: 90000
# Neither key can be used now, and the Generate screen says so.
- assertVisible:
    id: "no-key-notice"
- runFlow: ../common/go-to-settings.yaml
- extendedWaitUntil:
    visible:
      id: "manage-keys"
      text: ".*2 keys saved, 0 active..*"
    timeout: 30000
- tapOn:
    id: "manage-keys"
- assertVisible:
    id: "key-card-0"
    text: ".*Seed B.*Rejected.*"
- assertVisible:
    id: "key-card-1"
    text: ".*Seed A.*Off.*"

# Rename the key that is off, in its sheet.
- tapOn:
    id: "key-card-1"
- tapOn:
    id: "edit-key-name"
- assertVisible:
    id: "key-name-sheet"
- tapOn:
    id: "edit-key-label"
- inputText: "2"
- takeScreenshot: key-name-sheet
- tapOn:
    id: "edit-key-save"
- extendedWaitUntil:
    visible:
      id: "edit-key-title"
      text: "Seed A2"
    timeout: 15000
- tapOn:
    id: "back-button"

# Delete the rejected key: the app asks first.
- tapOn:
    id: "key-card-0"
- tapOn:
    id: "edit-key-delete"
- assertVisible: "Delete this key\\?"
- takeScreenshot: key-delete-dialog
- tapOn:
    id: "dialog-confirm"
- extendedWaitUntil:
    visible:
      id: "keys-screen"
    timeout: 15000
- assertVisible:
    id: "key-card-0"
    text: ".*Seed A2.*"
- assertNotVisible:
    id: "key-card-1"

# Leave the app signed out for the next flow.
- tapOn:
    id: "back-button"
- runFlow: ../common/sign-out.yaml
