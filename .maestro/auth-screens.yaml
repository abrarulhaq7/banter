# Sign-in and sign-up screens: a signed-out user lands on sign-in, sees clear messages for
# missing or bad input, and can move between the two screens. Does not need a Supabase
# project (nothing is sent to the server).
#
# Needs the development build installed on a booted simulator and the dev server running.
appId: com.banterlines.app
---
- runFlow: common/open-app.yaml
- runFlow: common/ensure-signed-out.yaml
- assertVisible: "Sign in to continue."
- takeScreenshot: sign-in

# Nothing typed: both fields explain what is missing.
- tapOn:
    id: "submit-button"
- assertVisible: "Enter your email."
- assertVisible: "Enter your password."

# Something that is not an email.
- tapOn:
    id: "email-input"
- inputText: "not-an-email"
- tapOn: "Banter"
- assertVisible: "This does not look like an email."
- takeScreenshot: sign-in-errors

# Over to sign-up, on the same screen.
- tapOn:
    id: "auth-mode-signUp"
- assertVisible:
    id: "sign-up-screen"
- assertVisible: "Create your account."
- assertVisible: "Create account"
# What was typed on Sign in is still there: switching does not leave the screen.
- assertVisible:
    id: "email-input"
    text: "not-an-email"

# A password that is too short is refused before anything is sent.
- tapOn:
    id: "email-input"
- eraseText: 30
- inputText: "sam@example.com"
- tapOn:
    id: "password-input"
- inputText: "short"
- tapOn: "Banter"
- tapOn:
    id: "submit-button"
- assertVisible: "Use at least 8 characters."
- takeScreenshot: sign-up-short-password

# The eye button shows the password that was typed, and hides it again.
- tapOn:
    id: "password-input-visibility"
- assertVisible:
    id: "password-input"
    text: "short"
- assertVisible: "Hide password"
- takeScreenshot: sign-up-password-shown
- tapOn:
    id: "password-input-visibility"
- assertVisible: "Show password"

# And back.
- tapOn:
    id: "auth-mode-signIn"
- runFlow: common/dismiss-password-prompt.yaml
- assertVisible:
    id: "sign-in-screen"
