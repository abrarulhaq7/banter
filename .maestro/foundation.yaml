# Design check: the preview screen shows the building blocks and switches between all three themes.
#
# Needs the development build installed on a booted simulator and the dev server running:
#   npm run ios        (first time, builds and installs)
#   npm start          (dev server)
#   npm run e2e
# Screenshots are saved under .maestro/artifacts/.
appId: com.banterlines.app
---
- runFlow: common/open-app.yaml
# The design preview is a development-only screen, reachable by link without signing in.
- openLink: "banter://foundation"
- runFlow: common/accept-open-link.yaml
- extendedWaitUntil:
    visible:
      id: "foundation-screen"
    timeout: 60000

- assertVisible: "Banter"
# The phone remembers the theme, so an earlier run may have left another one. Start from
# Midnight Plum whatever was there.
- tapOn:
    id: "theme-midnightPlum"
- assertVisible:
    id: "section-detail-Theme"
    text: "Midnight Plum"
- takeScreenshot: theme-midnight-plum

- tapOn:
    id: "theme-ember"
- assertVisible:
    id: "section-detail-Theme"
    text: "Ember"
- takeScreenshot: theme-ember

- tapOn:
    id: "theme-deepSea"
- assertVisible:
    id: "section-detail-Theme"
    text: "Deep Sea"
- takeScreenshot: theme-deep-sea

# Back to the default, so the flows after this one see the app as a new user does.
- tapOn:
    id: "theme-midnightPlum"
- assertVisible:
    id: "section-detail-Theme"
    text: "Midnight Plum"

# --- The parts added in Phase 5.5 ---------------------------------------------------------
- scrollUntilVisible:
    element:
      id: "banner-info"
    direction: DOWN
- waitForAnimationToEnd
- takeScreenshot: blocks-icons-and-notices
- scrollUntilVisible:
    element:
      id: "open-dialog"
    direction: DOWN
- waitForAnimationToEnd
- takeScreenshot: blocks-rows-and-choosing

# Segmented control: picking one selects it.
- tapOn:
    id: "segment-opener"
- assertVisible:
    id: "segment-opener"
    selected: true

# Toast: appears, then goes away by itself.
- tapOn:
    id: "show-toast"
- assertVisible:
    id: "toast"
- extendedWaitUntil:
    notVisible:
      id: "toast"
    timeout: 6000

# Sheet: opens, a choice closes it.
- tapOn:
    id: "open-sheet"
- assertVisible:
    id: "sample-option-b"
- takeScreenshot: blocks-sheet
- tapOn:
    id: "sample-option-b"
- assertNotVisible:
    id: "sample-option-b"

# Dialog: opens, Cancel closes it.
- tapOn:
    id: "open-dialog"
- assertVisible:
    id: "dialog-confirm"
- takeScreenshot: blocks-dialog
- tapOn:
    id: "dialog-cancel"
- assertNotVisible:
    id: "dialog-confirm"

# Chips: picking one selects it.
- scrollUntilVisible:
    element:
      id: "tone-Flirty"
    direction: DOWN
- waitForAnimationToEnd
- tapOn:
    id: "tone-Flirty"
- assertVisible:
    id: "tone-Flirty"
    selected: true

# Line card: tap to copy.
- scrollUntilVisible:
    element:
      id: "sample-line"
    direction: DOWN
- waitForAnimationToEnd
- tapOn:
    id: "sample-line"
- assertVisible:
    id: "sample-line"
    selected: true

- scrollUntilVisible:
    element:
      id: "button-primary"
    direction: DOWN
- waitForAnimationToEnd
- takeScreenshot: building-blocks
