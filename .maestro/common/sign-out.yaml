# From any screen that shows a Sign out button (Settings, or the first onboarding screen).
# Settings asks "Sign out?" first; onboarding does not.
appId: com.banterlines.app
---
- scrollUntilVisible:
    element:
      id: "sign-out-button"
    direction: DOWN
    timeout: 20000
- waitForAnimationToEnd
- tapOn:
    id: "sign-out-button"
- runFlow:
    when:
      visible:
        id: "dialog-confirm"
    commands:
      - tapOn:
          id: "dialog-confirm"
- extendedWaitUntil:
    visible:
      id: "sign-in-screen"
    timeout: 15000
