# From the sign-in screen: creates a new test account. Ends on the first onboarding screen.
# Needs output.email and output.password (see new-test-account.yaml).
appId: com.banterlines.app
---
- tapOn:
    id: "switch-button"
- tapOn:
    id: "email-input"
- inputText: ${output.email}
- tapOn:
    id: "password-input"
- inputText: ${output.password}
- tapOn: "Banter"
- tapOn:
    id: "submit-button"
- runFlow: dismiss-password-prompt.yaml
- extendedWaitUntil:
    visible:
      id: "onboarding-about-screen"
    timeout: 20000
