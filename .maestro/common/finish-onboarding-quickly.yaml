# From the first onboarding screen: gives a name, leaves the rest empty, skips the key.
# Ends on the Generate screen.
appId: com.banterlines.app
---
- tapOn:
    id: "profile-name"
- inputText: "Sam"
- runFlow: close-keyboard.yaml
- tapOn:
    id: "profile-submit"
- extendedWaitUntil:
    visible:
      id: "onboarding-voice-screen"
    timeout: 15000
- tapOn:
    id: "profile-submit"
- extendedWaitUntil:
    visible:
      id: "onboarding-key-screen"
    timeout: 15000
- tapOn:
    id: "skip-key"
- extendedWaitUntil:
    visible:
      id: "generate-screen"
    timeout: 15000
