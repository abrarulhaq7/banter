# From the first onboarding screen: gives a name, skips the key. Ends on the Generate screen.
appId: com.banterlines.app
---
- tapOn:
    id: "profile-name"
- inputText: "Sam"
- runFlow: close-keyboard.yaml
- scrollUntilVisible:
    element:
      id: "profile-submit"
    direction: DOWN
- waitForAnimationToEnd
- tapOn:
    id: "profile-submit"
- extendedWaitUntil:
    visible:
      id: "onboarding-key-screen"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "skip-key"
    direction: DOWN
- waitForAnimationToEnd
- tapOn:
    id: "skip-key"
- extendedWaitUntil:
    visible:
      id: "generate-screen"
    timeout: 15000
