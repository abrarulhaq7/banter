# After a password has been typed, iOS may ask "Save Password?" or "Update Password?".
# That prompt belongs to iOS, not to Banter, and it covers the screen. Decline it.
appId: com.banterlines.app
---
- extendedWaitUntil:
    visible: "Not Now"
    timeout: 3000
    optional: true
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
