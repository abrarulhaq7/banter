# Ends on the sign-in screen, whatever state an earlier run left the app in.
appId: com.banterlines.app
---
# Wait for the app to finish loading: any of its first screens will do.
- extendedWaitUntil:
    visible:
      id: "sign-in-screen|generate-screen|people-screen|settings-screen|onboarding-about-screen|onboarding-voice-screen|onboarding-key-screen"
    timeout: 90000
# Sign out is on the first onboarding screen: walk back to it.
- runFlow:
    when:
      visible:
        id: "onboarding-key-screen"
    commands:
      - tapOn:
          id: "back-button"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "onboarding-voice-screen"
    commands:
      - tapOn:
          id: "back-button"
      - waitForAnimationToEnd
# Opened on a screen above the tabs (left there by an earlier run, or by someone using the
# simulator): go Back until the tabs show.
- repeat:
    times: 5
    while:
      notVisible:
        id: "tab-settings"
    commands:
      - runFlow:
          when:
            visible:
              id: "back-button"
          commands:
            - tapOn:
                id: "back-button"
            - waitForAnimationToEnd
# Signed in and past onboarding: sign-out lives in the Settings tab.
- runFlow:
    when:
      visible:
        id: "tab-settings"
    commands:
      - runFlow: go-to-settings.yaml
- runFlow:
    when:
      notVisible:
        id: "sign-in-screen"
    commands:
      - runFlow: sign-out.yaml
- extendedWaitUntil:
    visible:
      id: "sign-in-screen"
    timeout: 20000
