# Ends on the sign-in screen, whatever state an earlier run left the app in.
appId: com.banterlines.app
---
# Wait for the app to finish loading: any of its first screens will do.
- extendedWaitUntil:
    visible:
      id: "sign-in-screen|generate-screen|onboarding-about-screen|onboarding-key-screen"
    timeout: 90000
- runFlow:
    when:
      visible:
        id: "onboarding-key-screen"
    commands:
      - tapOn:
          id: "back-button"
# Signed in and past onboarding: sign-out lives in Settings.
- runFlow:
    when:
      visible:
        id: "generate-screen"
    commands:
      - runFlow: go-to-settings.yaml
- runFlow:
    when:
      notVisible:
        id: "sign-in-screen"
    commands:
      - runFlow: sign-out.yaml
- extendedWaitUntil:
    visible:
      id: "sign-in-screen"
    timeout: 20000
